name: Build macOS DMG (Universal)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-dmg:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Create macOS application icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons/journal.iconset
          python3 - <<'PY'
          import zlib,struct,pathlib
          root=pathlib.Path('src-tauri/icons')
          def png(n):
              def chunk(tag,data):
                  return struct.pack('!I',len(data))+tag+data+struct.pack('!I',zlib.crc32(tag+data)&0xffffffff)
              rows=b''.join(b'\0'+bytes([42,77,100,255])*n for _ in range(n))
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('!2I5B',n,n,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(rows,9))+chunk(b'IEND',b'')
          for s in (16,32,64,128,256,512,1024):
              (root/f'{s}.png').write_bytes(png(s))
          for size in (16,32,128,256,512):
              (root/'journal.iconset'/f'icon_{size}x{size}.png').write_bytes(png(size))
              (root/'journal.iconset'/f'icon_{size}x{size}@2x.png').write_bytes(png(size*2))
          (root/'icon.png').write_bytes(png(512))
          (root/'32x32.png').write_bytes(png(32))
          (root/'128x128.png').write_bytes(png(128))
          PY
          iconutil -c icns src-tauri/icons/journal.iconset -o src-tauri/icons/icon.icns
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Universal DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run app:build -- --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Trading-Journal-Pro-v0.2.1-Universal-DMG
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
